<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Order High Tee Classics Liquid Laundry Soap."
  >

  <title>Order | High Tee Classics</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .order-hero {
      padding: 100px 7%;
      text-align: center;
      background:
        radial-gradient(
          circle at 80% 40%,
          rgba(200,155,92,0.18),
          transparent 30%
        ),
        var(--cream);
    }

    .order-hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(48px, 7vw, 76px);
      line-height: 1;
      color: var(--brown-dark);
      margin-bottom: 20px;
    }

    .order-hero h1 span {
      color: var(--brown-light);
    }

    .order-hero p {
      max-width: 600px;
      margin: auto;
      color: var(--muted);
      font-size: 16px;
    }


    .order-section {
      padding: 100px 7%;
      background: #fff;
    }

    .order-layout {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 60px;
      align-items: start;
    }


    /* PRODUCT CARD */

    .order-product-card {
      background: var(--brown-dark);
      color: white;
      padding: 25px;
      position: sticky;
      top: 105px;
    }

    .order-product-image {
      position: relative;
    }

    .order-product-image img {
      width: 100%;
      height: 430px;
      object-fit: cover;
    }

    .order-product-label {
      position: absolute;
      left: 15px;
      bottom: 15px;
      background: var(--brown-dark);
      color: white;
      padding: 12px 16px;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .order-product-info {
      padding: 25px 5px 5px;
    }

    .order-product-info h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .order-product-info p {
      color: #bdb1a9;
      font-size: 13px;
    }

    .order-product-price {
      margin-top: 18px;
      font-size: 27px;
      font-weight: 700;
      color: var(--gold-light);
    }


    /* FORM */

    .order-form-box {
      background: var(--cream-light);
      padding: 45px;
      border: 1px solid #eee4db;
    }

    .order-form-box h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--brown-dark);
      font-size: 42px;
      margin-bottom: 8px;
    }

    .order-form-intro {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      color: var(--brown-dark);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #d9cec4;
      background: white;
      padding: 15px;
      border-radius: 2px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      transition: 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--brown-light);
      box-shadow: 0 0 0 3px rgba(128,83,53,0.08);
    }

    .form-group textarea {
      min-height: 105px;
      resize: vertical;
    }


    /* QUANTITY */

    .quantity-control {
      display: flex;
      align-items: center;
      width: max-content;
      border: 1px solid #d9cec4;
      background: white;
    }

    .quantity-control button {
      width: 45px;
      height: 45px;
      border: none;
      background: var(--brown-dark);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .quantity-control input {
      width: 60px;
      height: 45px;
      border: none;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }


    /* SUMMARY */

    .order-summary {
      margin: 30px 0;
      padding: 22px;
      background: white;
      border: 1px solid #eee4db;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-total {
      border-top: 1px solid #eee4db;
      margin-top: 8px;
      padding-top: 15px;
      color: var(--brown-dark);
      font-size: 18px;
      font-weight: 700;
    }

    .order-submit {
      width: 100%;
      border: none;
      background: var(--brown-dark);
      color: white;
    }

    .order-submit:hover {
      background: var(--brown);
      transform: translateY(-2px);
    }

    .order-note {
      margin-top: 15px;
      text-align: center;
      color: #8a7d74;
      font-size: 11px;
    }


    @media (max-width: 900px) {

      .order-layout {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .order-product-card {
        position: static;
      }

    }


    @media (max-width: 600px) {

      .order-hero {
        padding: 75px 5%;
      }

      .order-section {
        padding: 65px 5%;
      }

      .order-form-box {
        padding: 28px 20px;
      }

      .order-form-box h2 {
        font-size: 34px;
      }

      .order-product-image img {
        height: 380px;
      }

    }

  </style>

</head>

    <a href="order.html" class="active">Order</a>

        <div class="order-product-image">

          <div class="order-product-label">
